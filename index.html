<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2f73">
<title>BKS Boling SMK Zainab 2026</title>
<style>
*{box-sizing:border-box}
:root{
  --navy:#0b2f73;--blue:#0d73da;--gold:#ffe16b;--bg:#eaf5ff;
  --text:#12315f;--line:#c9def4
}
body{margin:0;background:linear-gradient(180deg,#dceeff,#f8fbff);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:650px;margin:auto;padding-bottom:108px;min-height:100vh}
.top{
  background:#0b2f73;color:white;text-align:center;font-weight:1000;
  letter-spacing:3px;padding:15px 10px;font-size:15px
}
.hero{
  position:relative;margin:12px;border-radius:28px;overflow:hidden;
  background:transparent;box-shadow:0 10px 26px #0b3e8b4a;padding:0;border:0;
}
.locked-banner{
  display:block;width:100%;height:auto;border-radius:28px;
}

.ticker{
  background:#ffe472;color:#112f68;white-space:nowrap;overflow:hidden;
  font-weight:900;border-top:1px solid #f2d461;border-bottom:1px solid #f2d461
}
.ticker span{display:inline-block;padding:10px 0 10px 100%;animation:marq 22s linear infinite}
@keyframes marq{to{transform:translateX(-100%)}}
main{padding:12px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:3px}
.tiles button{
  min-height:90px;border:1px solid #b5d2f2;background:linear-gradient(#fff,#ecf4fe);
  color:#123c77;border-radius:20px;font-size:11px;font-weight:900;padding:10px 2px;
  box-shadow:0 4px 10px #2d72b51a
}
.tiles i{display:block;font-style:normal;font-size:25px;margin-bottom:4px}
.notice{
  margin:16px 0;background:white;border:1px solid #c9dff7;border-radius:22px;
  padding:17px 18px;font-weight:900;color:#0e60b9;box-shadow:0 4px 14px #0b54a817
}
.board{
  margin-top:14px;border-radius:28px;padding:18px;background:linear-gradient(135deg,#0f84ed,#063c9d);
  box-shadow:0 8px 18px #0b3e8b44;color:white
}
.board-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.board h2{margin:0;color:#ffe36d;font-size:26px;font-style:italic}
.more{
  border:0;background:white;color:#0e59b0;border-radius:999px;padding:8px 13px;font-weight:900;font-size:11px
}
.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}
.topcard{
  border-radius:20px;padding:12px 6px 13px;text-align:center;color:#143264;font-weight:900;
  min-height:180px;border:2px solid #ffffff66
}
.topcard.trio{background:#c9ecff}.topcard.men{background:#d4f6de}.topcard.women{background:#ffd6e9}
.topcard .medal{font-size:35px}.topcard h3{font-size:10px;min-height:28px;margin:8px 0 4px}
.topcard p{font-size:11px;min-height:34px;margin:8px 0}
.topcard strong{font-size:24px;display:block}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.quick button{
  text-align:left;border:1px solid #bdd9f5;background:white;border-radius:18px;padding:16px 12px;
  color:#0e55ad;font-weight:1000;box-shadow:0 4px 12px #0b54a814
}
.quick small{display:block;color:#607a9d;font-weight:700;margin-top:3px}
.panel{background:white;border:1px solid #c5dcf6;border-radius:22px;padding:14px;margin:12px 0;box-shadow:0 4px 15px #0b54a81a}
.panel h2{margin:5px 0 12px}
.tabs{display:flex;gap:7px;overflow:auto;padding:5px 0 10px}
.tabs button{border:1px solid #c8daf1;background:#eef5ff;color:#123d77;border-radius:12px;padding:10px 13px;font-weight:900;white-space:nowrap}
.tabs button.trio{background:#e8f2ff;color:#196ec8;border-color:#bdd6f6}
.tabs button.men{background:#e6f7ea;color:#2a984d;border-color:#bde0c6}
.tabs button.women{background:#ffe8f2;color:#e7288a;border-color:#f4bfd8}
.tabs button.trio.active,.tabs button.trio:focus{background:#1972c9;color:white;border-color:#1972c9}
.tabs button.men.active,.tabs button.men:focus{background:#2a984d;color:white;border-color:#2a984d}
.tabs button.women.active,.tabs button.women:focus{background:#ec268d;color:white;border-color:#ec268d}
.team{border-left:6px solid var(--a);background:var(--b);padding:12px;border-radius:13px;margin:10px 0}
.member{display:grid;grid-template-columns:1fr 62px 62px;gap:7px;align-items:center;border-bottom:1px solid #d8e7f7;padding:10px 0}
.member input,.laneinput{width:100%;padding:10px 3px;text-align:center;border:1px solid #abc7e8;border-radius:8px;background:white}
.primary{width:100%;border:0;background:#096dd9;color:white;border-radius:13px;padding:14px;font-weight:1000;margin-top:13px}
.rankbox{border-radius:16px;overflow:hidden;border:1px solid #bfd7ef;margin:10px 0 16px}
.ranktitle{padding:10px 12px;font-weight:1000;color:white}
.rankbox.trio .ranktitle,.rankbox.trio th{background:#1972c9}
.rankbox.men .ranktitle,.rankbox.men th{background:#2a984d}
.rankbox.women .ranktitle,.rankbox.women th{background:#ec268d}
.tablewrap{overflow-x:auto}
.ranktable{width:100%;border-collapse:collapse;table-layout:auto;font-size:10px}
.ranktable th{color:white;padding:8px 3px;white-space:nowrap}
.ranktable td{padding:9px 3px;text-align:center;border-bottom:1px solid #ffffff99;background:transparent;white-space:nowrap}
.ranktable td.name{text-align:left;font-weight:800;white-space:normal;line-height:1.2}
.rankbox.trio tbody tr:nth-child(odd){background:#dcecff}.rankbox.trio tbody tr:nth-child(even){background:#f2f8ff}
.rankbox.men tbody tr:nth-child(odd){background:#d9f4dd}.rankbox.men tbody tr:nth-child(even){background:#f1fff3}
.rankbox.women tbody tr:nth-child(odd){background:#ffd9e9}.rankbox.women tbody tr:nth-child(even){background:#fff0f6}
.ranktable .n{width:7%}.ranktable .name{width:34%}.ranktable .lane{width:8%}.ranktable .num{width:9%}.ranktable .hand{width:10%}.ranktable .total{width:10%}.ranktable .gap{width:10%}
.muted{color:#60799b;font-size:10px;font-weight:600}
.high{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.high .panel{text-align:center;margin:0}.high strong{font-size:32px;color:#0a68cf}
.bottom{
  position:fixed;bottom:8px;left:50%;transform:translateX(-50%);
  width:min(96%,640px);display:flex;justify-content:space-around;background:white;border:1px solid #bfdafa;
  border-radius:27px;box-shadow:0 6px 22px #062c7657;padding:8px 0;z-index:20
}
.bottom button{border:0;background:transparent;color:#526d93;font-weight:900;font-size:10px}
.bottom button span{display:block;font-size:24px}.bottom .active{color:#0671e7}
@media(max-width:420px){
  .hero{min-height:275px}  }


/* ===== INTRO CINEMATIC SMK ZAINAB — STYLE GIF ===== */
#bksIntro{
  position:fixed;inset:0;z-index:99999;overflow:hidden;
  background:#020c2d;
  display:flex;align-items:center;justify-content:center;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
}
#bksIntro.hide{animation:introOut .58s ease forwards}

#bksIntro .stadium{
  position:absolute;inset:0;
  background:
    radial-gradient(circle at 50% 47%,#168dff55 0 14%,transparent 42%),
    radial-gradient(circle at 50% 65%,#0e5fd966 0 18%,transparent 48%),
    linear-gradient(180deg,#03103a 0%,#06194c 43%,#073a8a 68%,#03102c 100%);
}
#bksIntro .stadium:before{
  content:"";position:absolute;left:-12%;right:-12%;bottom:-8%;height:46%;
  background:
    linear-gradient(90deg,transparent,#1b9fff33 22%,#ffffff26 50%,#1b9fff33 78%,transparent),
    repeating-linear-gradient(90deg,#ffffff0b 0 2px,transparent 2px 54px);
  transform:perspective(420px) rotateX(61deg);transform-origin:bottom;
  box-shadow:0 -34px 75px #00a8ff2e inset;
}
#bksIntro .stadium:after{
  content:"";position:absolute;left:0;right:0;top:43%;height:3px;
  background:linear-gradient(90deg,transparent,#2da6ff99,#fff,#2da6ff99,transparent);
  box-shadow:0 0 18px #2da6ff;opacity:.8;
}

#bksIntro .lightbar{
  position:absolute;top:0;width:38%;height:8px;border-radius:0 0 50% 50%;
  background:#dff6ff;box-shadow:0 0 20px #2f8fff,0 0 40px #2f8fff;
}
#bksIntro .lightbar.left{left:0;transform:rotate(12deg);transform-origin:left}
#bksIntro .lightbar.right{right:0;transform:rotate(-12deg);transform-origin:right}

#bksIntro .aura{
  position:absolute;width:min(84vw,430px);aspect-ratio:1;border-radius:50%;
  opacity:0;animation:auraIn .7s .12s ease-out forwards;
}
#bksIntro .aura:before,
#bksIntro .aura:after{
  content:"";position:absolute;inset:0;border-radius:50%;
}
#bksIntro .aura:before{
  background:
    conic-gradient(from 0deg,
      transparent 0 8%,#0ce5ff 12%,transparent 17% 31%,
      #177cff 37%,transparent 44% 59%,#7de9ff 66%,
      transparent 73% 86%,#146dff 92%,transparent 100%);
  filter:blur(5px);animation:spinAura 2.6s linear infinite;
  box-shadow:0 0 36px #1186ff88;
}
#bksIntro .aura:after{
  inset:8%;
  border:2px solid #8beaffaa;
  box-shadow:
    0 0 18px #26baff,
    0 0 55px #106dff,
    inset 0 0 32px #1a8fff88;
  animation:pulseAura 1.05s ease-in-out infinite alternate;
}

#bksIntro .orbital{
  position:absolute;width:min(96vw,490px);aspect-ratio:1;border-radius:50%;
  border:2px solid transparent;
  border-top-color:#52d9ff;border-right-color:#0f72ff;
  filter:drop-shadow(0 0 9px #1da9ff);
  opacity:.72;animation:orbit 2.2s linear infinite;
}
#bksIntro .orbital.o2{
  width:min(70vw,350px);animation-duration:1.45s;animation-direction:reverse;
  border-top-color:#fff;border-left-color:#087dff;opacity:.5;
}

#bksIntro .school-logo{
  position:absolute;width:min(52vw,275px);height:min(52vw,275px);object-fit:contain;
  opacity:0;z-index:6;
  filter:drop-shadow(0 0 11px #fff) drop-shadow(0 0 28px #2797ff);
  animation:crestReveal 1.05s .18s cubic-bezier(.18,.9,.25,1.2) forwards,
            crestFloat 1.4s 1.15s ease-in-out infinite alternate;
}
#bksIntro .crest-glow{
  position:absolute;width:min(44vw,235px);aspect-ratio:1;border-radius:50%;
  background:#48c6ff;filter:blur(45px);opacity:0;
  animation:glowPop .7s .35s ease-out forwards;
}

#bksIntro .sweep{
  position:absolute;width:150%;height:7px;left:-25%;
  background:linear-gradient(90deg,transparent,#4bdcff,#fff,#4bdcff,transparent);
  filter:blur(2px);opacity:0;z-index:7;
  animation:sweep 1.55s .55s ease-in-out forwards;
}

#bksIntro .tiny-pins{
  position:absolute;bottom:27%;left:10%;right:10%;height:28px;
  opacity:.45;filter:blur(.2px);
}
#bksIntro .tiny-pins span{
  position:absolute;bottom:0;width:7px;height:22px;background:#f7fbff;
  border-radius:50% 50% 38% 38%;box-shadow:0 0 8px #fff8;
}
#bksIntro .tiny-pins span:after{
  content:"";position:absolute;left:0;right:0;top:6px;height:3px;background:#e21f36;
}
#bksIntro .tiny-pins span:nth-child(1){left:22%}
#bksIntro .tiny-pins span:nth-child(2){left:31%;transform:scale(.85)}
#bksIntro .tiny-pins span:nth-child(3){right:31%;transform:scale(.85)}
#bksIntro .tiny-pins span:nth-child(4){right:22%}

#bksIntro .intro-label{
  position:absolute;bottom:10%;left:8%;right:8%;text-align:center;
  color:#fff;font-weight:900;letter-spacing:1px;font-size:clamp(14px,3.8vw,21px);
  opacity:0;transform:translateY(12px);z-index:8;
  text-shadow:0 3px 12px #001a55;
  animation:labelIn .5s 1.65s ease-out forwards;
}
#bksIntro .intro-label b{color:#ffdc3b}

#bksIntro .flash{
  position:absolute;inset:0;background:white;opacity:0;pointer-events:none;z-index:20;
  animation:flashHit .28s 2.25s ease-out forwards;
}

@keyframes auraIn{from{opacity:0;transform:scale(.45)}to{opacity:1;transform:scale(1)}}
@keyframes spinAura{to{transform:rotate(360deg)}}
@keyframes pulseAura{from{transform:scale(.96);opacity:.62}to{transform:scale(1.04);opacity:1}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes crestReveal{
  0%{opacity:0;transform:scale(.22) rotate(-7deg)}
  68%{opacity:1;transform:scale(1.08) rotate(1.5deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}
@keyframes crestFloat{from{transform:translateY(-3px)}to{transform:translateY(4px)}}
@keyframes glowPop{from{opacity:0;transform:scale(.4)}to{opacity:.45;transform:scale(1.15)}}
@keyframes sweep{
  0%{top:78%;opacity:0;transform:rotate(-5deg)}
  20%{opacity:.8}
  75%{opacity:.55}
  100%{top:22%;opacity:0;transform:rotate(4deg)}
}
@keyframes labelIn{to{opacity:1;transform:translateY(0)}}
@keyframes flashHit{
  0%{opacity:0}35%{opacity:.9}100%{opacity:0}
}
@keyframes introOut{
  to{opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.02)}
}
@media (prefers-reduced-motion:reduce){
  #bksIntro *{animation-duration:.01ms!important;animation-delay:0ms!important}
}

</style>
</head>

<script>
const T=[
["Hanif","Norly","Sick"],["Azizi","Nazri","Zurainee"],["Aunie","Mohd Nor","Nik Roslinda"],
["Zahari","Hasnina","Ayu"],["Wan M. Khuzaimi","Huda","Norlini"],["Zawawi","Asmariza","Hae"],
["Dahlam","Aznira","Maizatul"],["Eifham Syah","Mazura","Rabiatul"],["WerL","Siti Noor","Bella"],
["Fadli","Mahera","Cik Ei"],["Nordi","NorRehan","Khaziah"]
];
const MEN=new Set(["Hanif","Sick","Azizi","Nazri","Mohd Nor","Zahari","Wan M. Khuzaimi","Zawawi","Dahlam","Eifham Syah","WerL","Fadli","Nordi"]);
const KEY="bks26-v5";
let scores={}; try{scores=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
let page="home", editTeam=0, rankTab="trio";
const $=x=>document.getElementById(x);
const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function getScore(name){
  const v=scores[name];
  return Array.isArray(v)?[Number(v[0])||0,Number(v[1])||0]:[Number(v?.a)||0,Number(v?.b)||0];
}
function people(){
  return T.flatMap((team,ti)=>team.map(name=>{
    const g=getScore(name);
    return {name,team:ti+1,gender:MEN.has(name)?"men":"women",games:g,raw:g[0]+g[1]};
  }));
}
function trioRanks(){
  return T.map((members,i)=>{
    const g=[0,1].map(k=>members.reduce((a,n)=>a+getScore(n)[k],0));
    return {name:"Trio "+(i+1),members,team:i+1,games:g,total:g[0]+g[1]};
  }).sort((a,b)=>b.total-a.total || a.team-b.team);
}
function indivRanks(gender){
  return people().filter(p=>p.gender===gender).map(p=>({
    ...p,total:p.raw+(gender==="women"?10:0),hand:gender==="women"?10:0
  })).sort((a,b)=>b.total-a.total || a.name.localeCompare(b.name));
}
function lane(i){return localStorage.getItem("bkslane"+i)||""}
function go(p){page=p;render();scrollTo({top:0,behavior:"smooth"})}
function setEdit(i){editTeam=i;render()}
function saveScores(){
  T[editTeam].forEach((n,i)=>{
    scores[n]=[0,1].map(g=>Math.max(0,Math.min(300,Number($("g"+i+g).value)||0)));
  });
  localStorage.setItem(KEY,JSON.stringify(scores));
  localStorage.setItem("bkslane"+editTeam,$("lane").value.trim());
  render(); alert("Skor dan lane disimpan.");
}
function topWinner(kind){
  const arr=kind==="trio"?trioRanks():indivRanks(kind);
  return arr.find(x=>x.total>0);
}
function top3Home(){
  const specs=[["trio","TRIO","🥇"],["men","INDIVIDU LELAKI","🥈"],["women","INDIVIDU WANITA","🥉"]];
  return specs.map(([k,label,medal])=>{
    const x=topWinner(k);
    return `<div class="topcard ${k}"><div class="medal">${medal}</div><h3>${label}</h3><p>${x?esc(x.name):"Belum ada skor"}</p><strong>${x?x.total:"—"}</strong></div>`;
  }).join("");
}
function rankSection(kind,title){
  const a=kind==="trio"?trioRanks():indivRanks(kind);
  const top=Math.max(0,...a.map(x=>x.total));
  const rows=a.map((x,i)=>{
    const l=lane(x.team-1)||"—";
    const hand=kind==="women"?"+10":"—";
    return `<tr>
      <td>${i+1}</td>
      <td class="name">${esc(x.name)}${x.members?`<div class="muted">${x.members.map(esc).join(" • ")}</div>`:""}</td>
      <td>${esc(l)}</td><td>${x.games[0]}</td><td>${x.games[1]}</td><td>${hand}</td>
      <td><b>${x.total}</b></td><td>${top-x.total}</td>
    </tr>`;
  }).join("");
  return `<section id="rank-${kind}" class="rankbox ${kind}">
    <div class="ranktitle">${title}</div>
    <div class="tablewrap"><table class="ranktable">
      <thead><tr><th class="n">Bil</th><th class="name">Nama</th><th class="lane">Lane</th><th class="num">G1</th><th class="num">G2</th><th class="hand">Hand</th><th class="total">Jum</th><th class="gap">Beza</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </section>`;
}
function setRankTab(id){rankTab=id;render()}
function highCards(){
  return ["men","women"].map(g=>{
    const p=people().filter(x=>x.gender===g).flatMap(x=>x.games.map((score,i)=>({...x,score,game:i+1})))
      .filter(x=>x.score>0).sort((a,b)=>b.score-a.score)[0];
    return `<div class="panel"><h3>${g==="men"?"Lelaki":"Wanita"}</h3>${p?`<strong>${p.score}</strong><p>${esc(p.name)}</p><small>Trio ${p.team} • Game ${p.game}</small>`:"<p>Belum ada skor</p>"}</div>`;
  }).join("");
}

function render(){
  const nav=[["home","🏠","Utama"],["teams","👥","Trio"],["scores","🎳","Skor"],["ranking","📊","Ranking"],["high","🏆","High Score"]];
  $("nav").innerHTML=nav.map(([p,i,l])=>`<button class="${page===p?"active":""}" onclick="go('${p}')"><span>${i}</span>${l}</button>`).join("");
  const c=$("content");

  if(page==="home"){
    c.innerHTML=`
      <div class="tiles">
        <button onclick="go('home')"><i>🏆</i>Utama</button>
        <button onclick="go('teams')"><i>👥</i>Trio</button>
        <button onclick="go('scores')"><i>🎳</i>Skor</button>
        <button onclick="go('ranking')"><i>📊</i>Ranking</button>
        <button onclick="alert('Makluman kejohanan akan dipaparkan di sini.')"><i>📣</i>Makluman</button>
      </div>
      <div class="notice">📣 Kejohanan Boling BKS 2026 Sedang Berlangsung!</div>
      <div class="board">
        <div class="board-head"><h2>🏆 TOP 3 LIVE</h2><button class="more" onclick="go('ranking')">LIHAT SEMUA ›</button></div>
        <div class="top3">${top3Home()}</div>
      </div>
      <div class="quick">
        <button onclick="go('scores')">🎳 LIVE SCORE<small>Lihat keputusan terkini</small></button>
        <button onclick="go('ranking')">📊 RANKING<small>Kedudukan penuh peserta</small></button>
      </div>`;
  }
  else if(page==="teams"){
    const bg=["#e4f1ff","#e3f7ea","#f1e8ff","#fff0d7","#e2f7f7","#ffe8f1","#eaeaff","#fff6cf","#e1f7ef","#fcebe1","#f1e7fa"];
    const ac=["#1975d1","#1aa264","#8f55cc","#e09c25","#209aaa","#d65b97","#6664d4","#bd9625","#188d7a","#c77740","#8451b4"];
    c.innerHTML=`<div class="panel"><h2>👥 Senarai 11 Trio</h2>`+
      T.map((t,i)=>`<div class="team" style="--a:${ac[i]};--b:${bg[i]}"><b>TRIO ${i+1} • Lane ${esc(lane(i)||"—")}</b><p>${t.map(n=>`${esc(n)} (${MEN.has(n)?"L":"P"})`).join(" • ")}</p></div>`).join("")+
      `</div>`;
  }
  else if(page==="scores"){
    c.innerHTML=`<div class="panel"><h2>🎳 Masukkan Skor</h2>
      <div class="tabs">${T.map((_,i)=>`<button class="${i===editTeam?"active":""}" onclick="setEdit(${i})">Trio ${i+1}</button>`).join("")}</div>
      <p><b>TRIO ${editTeam+1}</b></p>
      <div style="display:grid;grid-template-columns:80px 1fr;gap:8px;align-items:center"><b>Lane</b><input id="lane" class="laneinput" value="${esc(lane(editTeam))}"></div>
      <div class="member muted"><b>Nama</b><b>Game 1</b><b>Game 2</b></div>
      ${T[editTeam].map((n,i)=>`<div class="member"><b>${esc(n)}</b>${getScore(n).map((v,g)=>`<input id="g${i}${g}" type="number" min="0" max="300" inputmode="numeric" value="${v||""}">`).join("")}</div>`).join("")}
      <button class="primary" onclick="saveScores()">💾 SIMPAN SKOR & LANE</button>
    </div>`;
  }
  else if(page==="ranking"){
    const title = rankTab==="trio" ? "🎳 Trio" : rankTab==="men" ? "🎳 Individu Lelaki" : "🎳 Individu Wanita";
    c.innerHTML=`<div class="panel">
      <h2>📊 Ranking Live</h2>
      <div class="tabs">
        <button class="trio ${rankTab==='trio'?'active':''}" onclick="setRankTab('trio')">Trio</button>
        <button class="men ${rankTab==='men'?'active':''}" onclick="setRankTab('men')">Individu Lelaki</button>
        <button class="women ${rankTab==='women'?'active':''}" onclick="setRankTab('women')">Individu Wanita</button>
      </div>
      ${rankSection(rankTab,title)}
    </div>`;
  }
  else{
    c.innerHTML=`<div class="panel"><h2>🏆 High Score</h2><div class="high">${highCards()}</div></div>`;
  }
}
render();
</script>

<script>
/* ===== INTRO SOUND FX =====
   Cuba autoplay. Jika iPhone/Safari sekat audio, bunyi akan aktif
   pada sentuhan pertama tanpa memerlukan butang tambahan.
*/
(function(){
  let played=false, ctx=null;

  function noiseBuffer(audioCtx, seconds=0.45){
    const rate=audioCtx.sampleRate;
    const b=audioCtx.createBuffer(1, Math.floor(rate*seconds), rate);
    const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++){
      const t=i/d.length;
      d[i]=(Math.random()*2-1)*(1-t);
    }
    return b;
  }

  function bowlingFX(){
    if(played) return;
    played=true;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;

    ctx = ctx || new AC();

    const start = ctx.currentTime + 0.05;

    // Bunyi bola golek di lane (low rumble + subtle rolling pulses)
    const rumble=ctx.createOscillator();
    const rumbleGain=ctx.createGain();
    rumble.type='sine';
    rumble.frequency.setValueAtTime(72,start);
    rumble.frequency.linearRampToValueAtTime(92,start+1.45);
    rumbleGain.gain.setValueAtTime(0.0001,start);
    rumbleGain.gain.exponentialRampToValueAtTime(0.12,start+0.12);
    rumbleGain.gain.exponentialRampToValueAtTime(0.035,start+1.48);
    rumble.connect(rumbleGain).connect(ctx.destination);
    rumble.start(start);
    rumble.stop(start+1.5);

    // Rolling pulses
    for(let i=0;i<8;i++){
      const o=ctx.createOscillator(), g=ctx.createGain();
      const t=start+0.18+i*0.16;
      o.type='triangle';
      o.frequency.value=125+(i*4);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.045,t+0.018);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.08);
      o.connect(g).connect(ctx.destination);
      o.start(t); o.stop(t+0.09);
    }

    // Pin impact / strike around 1.65s
    const hit=start+2.02;

    const src=ctx.createBufferSource();
    const hp=ctx.createBiquadFilter();
    const ng=ctx.createGain();
    hp.type='highpass'; hp.frequency.value=700;
    src.buffer=noiseBuffer(ctx,0.55);
    ng.gain.setValueAtTime(0.0001,hit);
    ng.gain.exponentialRampToValueAtTime(0.36,hit+0.008);
    ng.gain.exponentialRampToValueAtTime(0.0001,hit+0.5);
    src.connect(hp).connect(ng).connect(ctx.destination);
    src.start(hit);

    // Metallic pin clacks
    [510,690,880,1120,1450].forEach((f,j)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      const t=hit+j*0.025;
      o.type='square';
      o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.055,t+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.18+j*0.025);
      o.connect(g).connect(ctx.destination);
      o.start(t); o.stop(t+0.24);
    });
  }

  function tryPlay(){
    try{
      bowlingFX();
      if(ctx && ctx.state==='suspended') ctx.resume();
    }catch(e){}
  }

  // Cuba terus semasa intro bermula
  setTimeout(tryPlay,120);

  // Fallback Safari/iPhone: sentuhan pertama aktifkan audio.
  ['touchstart','pointerdown','click'].forEach(ev=>{
    document.addEventListener(ev, function unlock(){
      try{
        if(ctx && ctx.state==='suspended') ctx.resume();
        if(!played) bowlingFX();
      }catch(e){}
    }, {once:true, passive:true});
  });
})();
</script>

(function(){
  function closeIntro(){
    const intro=document.getElementById('bksIntro');
    if(!intro) return;
    intro.classList.add('hide');
    setTimeout(()=>{ if(intro && intro.parentNode) intro.parentNode.removeChild(intro); },650);
  }
  window.addEventListener('load', ()=>setTimeout(closeIntro, 2900));
  setTimeout(closeIntro, 4200); // fail-safe
})();
</script>
