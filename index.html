-weight:900}.tiles i{display:block;font-size:25px;font-style:normal}.panel{background:white;border:1px solid #c5dcf6;border-radius:22px;padding:16px;margin:14px 0;box-shadow:0 4px 15px #0b54a820}.board{background:linear-gradient(135deg,#1485ef,#07358e);color:white;padding:18px;border-radius:25px;margin-top:15px}.board h2{color:#ffe36c;font-style:italic;margin:0 0 15px}.podium{display:grid;grid-template-columns:1fr 1fr;gap:10px}.podium>div{border-radius:20px;padding:12px 5px;text-align:center;background:#ffe17a;color:#163261;font-weight:900}.podium>div:nth-child(2){background:#e5e9f3}.podium>div:nth-child(3){background:#ffcead}.podium>div:nth-child(4){background:#dec8f6}.podium strong{display:block;font-size:26px}.tabs{display:flex;gap:7px;overflow:auto;padding:9px 0}.tabs button{border:1px solid #a7cbef;background:#f1f7ff;color:#1456a4;border-radius:12px;padding:10px;font-weight:900;white-space:nowrap}.tabs .active{background:#096bd9;color:white}.team{border-left:6px solid var(--accent,#1779d7);background:var(--bg,#e5f0ff);padding:12px;border-radius:12px;margin:10px 0}.member{display:grid;grid-template-columns:1fr 62px 62px;gap:7px;align-items:center;border-bottom:1px solid #d9e8f8;padding:12px 0}.member input{width:100%;min-width:0;padding:10px 1px;text-align:center;border:1px solid #abc6e7;border-radius:8px}.primary{background:#086cda;color:white;font-weight:900;border:0;border-radius:13px;padding:14px;width:100%;margin-top:13px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;min-width:700px;width:100%;font-size:12px}th{background:#0a5ec5;color:white;padding:10px 5px}td{padding:10px 5px;border-bottom:1px solid #dceafa;text-align:center}td:nth-child(2){text-align:left;font-weight:800}tr:nth-child(even){background:#f1f7ff}.muted{color:#657d9f;font-size:12px}.high{display:grid;grid-template-columns:1fr 1fr;gap:10px}.high .panel{text-align:center;margin:0;padding:10px 4px}.high strong{font-size:30px;color:#096bd8}.bottom{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);width:min(96%,640px);display:flex;justify-content:space-around;background:white;border:1px solid #bfdafa;border-radius:25px;box-shadow:0 5px 20px #062c7666;padding:9px 0;z-index:5}.bottom button{border:0;background:transparent;color:#47658d;font-weight:900;font-size:10px}.bottom button span{display:block;font-size:24px}.bottom .active{color:#0072e9}.warn{background:#fff3d6;color:#74531a;padding:12px;border-radius:12px;margin:14px 0;font-size:12px}

<img src="bowling.jpg" alt="Boling" width="100%"><div class="app"><div class="top"><img src="assets/zainab.jpg" alt="Lencana SMK Zainab"><span>BKS • SMK ZAINAB • 2026</span><img src="assets/eil.jpg" alt="Lencana EIL"></div><header class="hero"><small>BADAN KEBAJIKAN STAF SMK ZAINAB</small><h1>KEJOHANAN <em>BOLING</em> 2026</h1><p>MIX TRIO • 11 PASUKAN • 2 GAME</p><img class="pins" src="assets/two-pins.jpg" alt="Pin boling realistik"></header><div class="ticker"><span>KEJOHANAN BOLING BKS SMK ZAINAB 2026 &nbsp; ✦ &nbsp; 21 OKTOBER 2026 &nbsp; ✦ &nbsp; RABU &nbsp; ✦ &nbsp; 2.30 PTG &nbsp; ✦ &nbsp; LITE SUPERBOWL</span></div><main id="content"></main><nav id="nav" class="bottom"></nav></div><script>
const T=[["Hanif","Norly","Sick"],["Azizi","Nazri","Zurainee"],["Aunie","Mohd Nor","Nik Roslinda"],["Zahari","Hasnina","Ayu"],["Wan M. Khuzaimi","Huda","Norlini"],["Zawawi","Asmariza","Hae"],["Dahlam","Aznira","Maizatul"],["Eifham Syah","Mazura","Rabiatul"],["WerL","Siti Noor","Bella"],["Fadli","Mahera","Cik Ei"],["Nordi","NorRehan","Khaziah"]],M=new Set(["Hanif","Sick","Azizi","Nazri","Mohd Nor","Zahari","Wan M. Khuzaimi","Zawawi","Dahlam","Eifham Syah","WerL","Fadli","Nordi"]),KEY="bks26-v5";let s={};try{s=JSON.parse(localStorage.getItem(KEY)||"{}")}catch{}let page="home",tab="trio",edit=0;const $=id=>document.getElementById(id),esc=x=>String(x).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));function get(n){let v=s[n];return Array.isArray(v)?v:[Number(v?.a)||0,Number(v?.b)||0]}function ppl(){return T.flatMap((t,i)=>t.map(n=>({name:n,team:i+1,gender:M.has(n)?"men":"women",games:get(n),total:get(n).reduce((a,b)=>a+(+b||0),0)})))}function ranks(k){return k==="trio"?T.map((t,i)=>({name:"Trio "+(i+1),team:i+1,members:t,games:[0,1].map(g=>t.reduce((a,n)=>a+(+get(n)[g]||0),0)),total:t.reduce((a,n)=>a+get(n).reduce((x,y)=>x+(+y||0),0),0)})).sort((a,b)=>b.total-a.total):ppl().filter(p=>p.gender===k).sort((a,b)=>b.total-a.total)}function lane(i){return localStorage.getItem("bkslane"+i)||""}function go(p){page=p;render();scrollTo(0,0)}function setTab(t){tab=t;render()}function setEdit(i){edit=i;render()}function save(){T[edit].forEach((n,i)=>s[n]=[0,1].map(g=>Math.max(0,Math.min(300,Number($("g"+i+g).value)||0))));localStorage.setItem(KEY,JSON.stringify(s));localStorage.setItem("bkslane"+edit,$("lane").value);render();alert("Skor dan lane disimpan.")}function table(k){let a=ranks(k),hc=k==="trio"?30:10,top=Math.max(0,...a.map(x=>x.total+hc));return '<div class="tablewrap"><table><tr>'+["Bil","Nama","Lane","Game 1","Game 2","Handicap (10)","Jum","Beza"].map(x=>'<th>'+x+'</th>').join("")+'</tr>'+a.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.name)+(x.members?'<div class="muted">'+x.members.map(esc).join(" • ")+'</div>':'')+'</td><td>'+esc(lane(x.team-1)||"—")+'</td><td>'+x.games[0]+'</td><td>'+x.games[1]+'</td><td>'+hc+'</td><td><b>'+(x.total+hc)+'</b></td><td>'+(top-x.total-hc)+'</td></tr>').join("")+'</table></div>'}function highs(){return ["men","women"].map(k=>{let p=ppl().filter(x=>x.gender===k).flatMap(x=>x.games.map((score,i)=>({...x,score:+score||0,game:i+1}))).filter(x=>x.score>0).sort((a,b)=>b.score-a.score)[0];return '<div class="panel"><h3>'+(k==="men"?"Lelaki":"Perempuan")+'</h3>'+(p?'<strong>'+p.score+'</strong><p>'+esc(p.name)+'</p><small>Trio '+p.team+' • Game '+p.game+'</small>':'<p>Belum ada skor</p>')+'</div>'}).join("")}function render(){let items=[["home","🏠","Utama"],["teams","👥","Trio"],["scores","🎳","Skor"],["ranking","📊","Ranking"],["high","🏆","High Score"]];$("nav").innerHTML=items.map(([p,i,l])=>'<button class="'+(p===page?"active":"")+'" onclick="go(\''+p+'\')"><span>'+i+'</span>'+l+'</button>').join("");let c=$("content");if(page==="home"){let a=ranks("trio").filter(x=>x.total>0);c.innerHTML='<div class="tiles">'+[["teams","👥","11 Trio"],["scores","🎳","Isi Skor"],["ranking","📊","Ranking"],["high","🏆","High Score"]].map(([p,i,l])=>'<button onclick="go(\''+p+'\')"><i>'+i+'</i>'+l+'</button>').join("")+'</div><div class="panel" style="color:#075ab2;font-weight:900">📣 KEJOHANAN BOLING BKS 2026 🎳</div><div class="board"><h2>🏆 TOP 4 LIVE</h2><div class="podium">'+[0,1,2,3].map(i=>'<div><div style="font-size:28px">'+["🥇","🥈","🥉","🏅"][i]+'</div><p>'+(a[i]?esc(a[i].name):"Belum ada skor")+'</p><strong>'+(a[i]?a[i].total+30:"—")+'</strong></div>').join("")+'</div></div><div class="warn">Skor disimpan pada peranti ini sahaja. Penyegerakan antara telefon belum tersedia.</div>'}else if(page==="teams")c.innerHTML='<div class="panel"><h2>👥 Senarai 11 Trio</h2>'+T.map((t,i)=>'<div class="team" style="--bg:'+["#e5f0ff","#e4f6eb","#f2e5ff","#fff0d7","#e0f6f7","#ffe7f1","#e8e8ff","#fff7ce","#dff6ef","#fce9df","#f0e5fa"][i]+';--accent:'+["#1779d7","#13a369","#9554d0","#e4a22e","#1d9caa","#d85b98","#6663d5","#c09a25","#198e7b","#c97942","#8652b5"][i]+'"><b>TRIO '+(i+1)+' • Lane '+esc(lane(i)||"—")+'</b><p>'+t.map(n=>esc(n)+" ("+(M.has(n)?"L":"P")+")").join(" • ")+'</p></div>').join("")+'</div>';else if(page==="scores")c.innerHTML='<div class="panel"><h2>🎳 Masukkan Skor</h2><div class="tabs">'+T.map((_,i)=>'<button class="'+(i===edit?"active":"")+'" onclick="setEdit('+i+')">Trio '+(i+1)+'</button>').join("")+'</div><h3>TRIO '+(edit+1)+'</h3>Lane <input id="lane" style="width:80px;padding:8px;border:1px solid #aac9e9;border-radius:9px" value="'+esc(lane(edit))+'"><div class="member muted"><b>Nama</b><b>Game 1</b><b>Game 2</b></div>'+T[edit].map((n,i)=>'<div class="member"><b>'+esc(n)+'</b>'+get(n).map((v,g)=>'<input id="g'+i+g+'" type="number" min="0" max="300" inputmode="numeric" value="'+(v||"")+'">').join("")+'</div>').join("")+'<button class="primary" onclick="save()">💾 SIMPAN SKOR & LANE</button></div>';else if(page==="ranking")c.innerHTML='<div class="panel"><h2>📊 Skor Semasa</h2><div class="tabs">'+[["trio","Trio"],["men","Individu Lelaki"],["women","Individu Perempuan"]].map(([k,l])=>'<button class="'+(k===tab?"active":"")+'" onclick="setTab(\''+k+'\')">'+l+'</button>').join("")+'</div>'+table(tab)+'</div>';else c.innerHTML='<div class="panel"><h2>🏆 High Score</h2><div class="high">'+highs()+'</div></div>'}render();
</script></body></html>
